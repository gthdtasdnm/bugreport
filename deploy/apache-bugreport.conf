# Bugreport hinter Apache als Reverse Proxy unter https://inf-zeus.de/bugreport/
#
# Nach /etc/apache2/conf-available/bugreport.conf, dann:
#   sudo a2enmod proxy proxy_http
#   sudo a2enconf bugreport
#   sudo apache2ctl configtest && sudo systemctl reload apache2

# Ohne abschließenden Slash würden style.css/app.js relativ zu / aufgelöst.
RedirectMatch permanent "^/bugreport$" "/bugreport/"

# Kein WebSocket in diesem Projekt – proxy_wstunnel wird hier nicht gebraucht.
ProxyPass        /bugreport/    http://127.0.0.1:8079/
ProxyPassReverse /bugreport/    http://127.0.0.1:8079/
