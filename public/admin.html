<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bugreport – Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">

  <header class="brand">
    <h1 class="logo">BUG<span>ADMIN</span></h1>
    <p class="tag">Abhaken, notieren, wegräumen</p>
  </header>

  <!-- ===================== Anmeldung ===================== -->
  <section id="anmeldung" class="panel narrow" style="margin: 0 auto">
    <label class="field">
      <span>Passwort</span>
      <input id="passwort" type="password" autocomplete="current-password">
    </label>
    <button id="anmelden" class="btn primary big">Anmelden</button>
    <p class="small muted center">
      Das Passwort steht in <code>BUGREPORT_ADMIN_TOKEN</code> bzw. beim Start im Log.
    </p>
  </section>

  <!-- ===================== Verwaltung ===================== -->
  <section id="verwaltung" hidden>
    <div class="zahlen">
      <span class="zahl offen">Offen <b id="zahlOffen">0</b></span>
      <span class="zahl erledigt">Erledigt <b id="zahlErledigt">0</b></span>
      <span class="zahl">Gesamt <b id="zahlGesamt">0</b></span>
    </div>

    <div class="filter" style="margin: 14px 0">
      <select id="filterSpiel" aria-label="Nach Spiel filtern">
        <option value="">Alles</option>
      </select>
    </div>
    <div class="filter" style="margin-bottom: 14px">
      <button class="chip sel" data-filter-status="offen">Nur offene</button>
      <button class="chip" data-filter-status="erledigt">Nur erledigte</button>
      <button class="chip" data-filter-status="">Alle</button>
    </div>

    <div id="liste" class="liste"></div>

    <p class="small muted center" style="margin-top: 18px">
      <a href="./" style="color: inherit">Zur Startseite</a> ·
      <button id="abmelden" class="btn sm ghost">Abmelden</button>
    </p>
  </section>

</main>

<div id="toast"></div>
<script src="gemeinsam.js"></script>
<script src="admin.js"></script>
</body>
</html>
